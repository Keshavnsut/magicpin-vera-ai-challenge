services:
  - type: web
    name: magicpin-vera-challenge
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn bot:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /v1/healthz
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: TEAM_NAME
        value: Vera Challenge Participant
      - key: TEAM_MEMBERS
        value: ""
      - key: CONTACT_EMAIL
        value: ""
      - key: APP_VERSION
        value: 1.0.0
